name: tests

on:
  push:
  pull_request:
  schedule:
    # Monthly run against the latest Python releases.
    - cron: "17 4 3 * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m unittest discover -s tests -v
